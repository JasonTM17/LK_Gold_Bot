[project]
name = "lk-gold-bot"
version = "1.0.0"
description = "Personal Telegram assistant for public Locket links, safety checklists, SQLite usage tracking, and optional NextDNS setup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "JasonTM17" }
]
keywords = ["telegram-bot", "python", "locket", "sqlite", "nextdns", "personal-assistant"]
dependencies = [
  "aiohttp>=3.9,<4",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21,<23",
]

[project.urls]
Homepage = "https://github.com/JasonTM17/LK_Gold_Bot"
Repository = "https://github.com/JasonTM17/LK_Gold_Bot"
Issues = "https://github.com/JasonTM17/LK_Gold_Bot/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]