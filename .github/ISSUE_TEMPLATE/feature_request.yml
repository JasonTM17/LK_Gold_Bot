name: Feature request
description: Suggest a safe personal-assistant feature
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature and any configuration it needs.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy notes
      description: Explain how this avoids collecting secrets or bypassing third-party services.